name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Gradle Memory
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx4G -Dorg.gradle.daemon=false -XX:MaxMetaspaceSize=1g" > android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Telephony Namespace
        run: |
          sed -i '/android {/a namespace "com.shounakmulay.telephony"' ~/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle || true

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-android-apk
          path: build/app/outputs/apk/release/app-release.apk
